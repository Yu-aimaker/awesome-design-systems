<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AwesomeDS token preview</title><style>:root {
  --background: oklch(0.995 0.002 255);
  --foreground: oklch(0.18 0.02 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.42 0.15 255);
  --primary-foreground: oklch(1 0 0);
  --muted-foreground: oklch(0.46 0.02 260);
  --accent: oklch(0.90 0.008 255);
  --border: oklch(0.90 0.008 255);
  --destructive: oklch(0.5 0.14 25);
  --ring: oklch(0.18 0.02 260);
  --popover: oklch(1 0 0);
}
.dark {
  --background: oklch(0.18 0.02 260);
  --foreground: oklch(0.995 0.002 255);
  --card: oklch(0.22 0.02 260);
  --primary: oklch(0.70 0.12 255);
  --primary-foreground: oklch(0.18 0.02 260);
  --muted-foreground: oklch(0.62 0.018 260);
  --accent: oklch(0.28 0.022 260);
  --border: oklch(0.28 0.022 260);
  --destructive: oklch(0.68 0.12 40);
  --ring: oklch(0.995 0.002 255);
  --popover: oklch(0.22 0.02 260);
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --duration-fast: 120ms;
  --duration-base: 180ms;
  --duration-slow: 280ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --type-display: 48px;
  --line-display: 1.15;
  --weight-display: 500;
  --tracking-display: -0.03em;
  --type-title: 32px;
  --line-title: 1.25;
  --weight-title: 500;
  --tracking-title: -0.02em;
  --type-heading: 22px;
  --line-heading: 1.4;
  --weight-heading: 500;
  --tracking-heading: -0.015em;
  --type-body: 16px;
  --line-body: 1.75;
  --weight-body: 400;
  --tracking-body: 0.01em;
  --type-small: 13px;
  --line-small: 1.65;
  --weight-small: 400;
  --tracking-small: 0.01em;
  --type-label: 12px;
  --line-label: 1.4;
  --weight-label: 500;
  --tracking-label: 0.06em;
  --layout-page: 1080px;
  --layout-rail: 232px;
  --layout-gutter: 24px;
}body{background:var(--background);color:var(--foreground);font:16px/1.75 system-ui;margin:24px}button{background:var(--primary);color:var(--primary-foreground);padding:12px 24px;border:0;border-radius:var(--radius-md)}main{max-width:800px}section{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.swatch{width:140px}i{display:block;height:80px;border:1px solid var(--border);border-radius:var(--radius-md)}</style><main><h1>AwesomeDS tokens</h1><p>White and dark surfaces. Blue decisions. Generated from tokens.json.</p><button onclick="document.documentElement.classList.toggle('dark')">Toggle theme</button><section><div class="swatch"><i style="background:var(--background)"></i>background</div><div class="swatch"><i style="background:var(--foreground)"></i>foreground</div><div class="swatch"><i style="background:var(--card)"></i>card</div><div class="swatch"><i style="background:var(--primary)"></i>primary</div><div class="swatch"><i style="background:var(--primary-foreground)"></i>primary-foreground</div><div class="swatch"><i style="background:var(--muted-foreground)"></i>muted-foreground</div><div class="swatch"><i style="background:var(--accent)"></i>accent</div><div class="swatch"><i style="background:var(--border)"></i>border</div><div class="swatch"><i style="background:var(--destructive)"></i>destructive</div><div class="swatch"><i style="background:var(--ring)"></i>ring</div><div class="swatch"><i style="background:var(--popover)"></i>popover</div></section><p>Live component previews: apps/web → /gallery</p></main></html>
